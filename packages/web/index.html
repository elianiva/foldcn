    <title>foldcn — Foldkit component registry</title>
    <script>
      // Apply the stored theme (or default to the system preference) before
      // first paint so the prerendered page doesn't flash the wrong mode.
      ;(function () {
        var preference =
          typeof localStorage !== 'undefined' ? localStorage.getItem('foldcn-theme') : null
        var dark =
          preference === 'dark'
            ? true
            : preference === 'light'
              ? false
              : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
