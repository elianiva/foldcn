packages:
  - packages/*
minimumReleaseAge: 0
allowBuilds:
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  workerd: true
# Foldkit 0.169 pins Effect and @effect/platform-browser to 4.0.0 exactly.
# Keep Alchemy's optional Effect integrations on that same release; otherwise
# pnpm selects 4.0.6, which does not satisfy Foldkit's exact Effect peer.
# @effect/vitest is unused and its current release requires Effect ^4.0.6.
overrides:
  '@effect/platform-node@4.0.0>@effect/platform-node-shared': 4.0.0
  '@effect/sql-d1': 4.0.0
  '@effect/sql-sqlite-do': 4.0.0
  '@effect/vitest': '-'
