packages:
  - packages/*
minimumReleaseAge: 0
allowBuilds:
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  workerd: true
# Foldkit 0.171 pins effect and @effect/platform-browser to the 4.1 line.
# Keep Alchemy and the Effect platform packages on that same release; a
# separate 4.0 copy cannot satisfy Foldkit's ~4.1.0 peer.
# @effect/vitest is unused and its current release requires effect ^4.1.4.
# Alchemy's Cloudflare runtime accepts unenv ^2.0.0-rc.24, but its
# @cloudflare/unenv-preset peer is pinned to rc.24. Keep the pair together.
overrides:
  '@effect/vitest': '-'
  unenv: 2.0.0-rc.24
